{# Page shell. Every page extends this. #}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/cyoa.css') }}" />
    {# Vendored, not CDN-loaded: the app must work with no outbound internet. #}
    <script src="{{ url_for('static', path='/js/htmx.min.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ url_for('library_index') }}">{{ site_name }}</a>
    </header>

    <main id="main">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <p>A choose-your-own-adventure engine.</p>
    </footer>
  </body>
</html>
