name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the publish workflow can gate on the same checks rather than
  # duplicating them.
  workflow_call:

jobs:
  quality:
    name: Lint, format, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest
